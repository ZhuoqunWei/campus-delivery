[project]
name = "delivery-analytics"
version = "0.1.0"
description = "Spark Structured Streaming metrics over Campus Delivery's Kafka topics"
requires-python = ">=3.10"
dependencies = ["pyspark==4.1.3"]

[project.optional-dependencies]
test = ["pytest>=8", "testcontainers[kafka]>=4.9", "kafka-python>=2.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -p no:cacheprovider"
markers = ["streaming: runs Spark Structured Streaming against a Kafka testcontainer (needs Docker)"]
log_cli = false
