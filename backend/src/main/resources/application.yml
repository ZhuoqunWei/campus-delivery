spring:
  application:
    name: campus-delivery
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/campus}
    username: ${SPRING_DATASOURCE_USERNAME:campus}
    password: ${SPRING_DATASOURCE_PASSWORD:campus}
    hikari:
      maximum-pool-size: 20
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null
  mvc:
    problemdetails:
      enabled: true
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 3000
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
        linger.ms: 20
    admin:
      fail-fast: false

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

app:
  jwt:
    # Must be at least 32 bytes. Override in production.
    secret: ${APP_JWT_SECRET:campus-delivery-dev-secret-change-me-please-0123456789}
    ttl: 12h
  campus:
    name: ${APP_CAMPUS_NAME:Main Campus}
    lat: ${APP_CAMPUS_LAT:37.8719}
    lng: ${APP_CAMPUS_LNG:-122.2585}
  assignment:
    tick-ms: ${APP_ASSIGNMENT_TICK_MS:1000}
    offer-ttl: ${APP_OFFER_TTL:20s}
    radius-meters: ${APP_ASSIGNMENT_RADIUS_M:3000}
    courier-freshness: 90s
    retry-cooldown: 5m
  location:
    stale-after: ${APP_LOCATION_STALE_AFTER:30s}
    max-batch: 200
    max-future-skew: 30s
  dispatch:
    stuck-after: ${APP_DISPATCH_STUCK_AFTER:3m}
  ws:
    replay-limit: 1000
  kafka:
    enabled: ${APP_KAFKA_ENABLED:true}
    outbox-tick-ms: 500
    order-events-topic: order-events.v1
    courier-events-topic: courier-events.v1
    courier-locations-topic: courier-locations.v1
  seed:
    enabled: ${APP_SEED_ENABLED:true}
    customers: 3
    couriers: 20
    password: ${APP_SEED_PASSWORD:password}

logging:
  level:
    dev.campusdelivery: INFO
    org.apache.kafka: WARN
